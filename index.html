<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Store - Premium Earbuds</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 PayPal SDK（将 YOUR_PAYPAL_CLIENT_ID 替换为你的真实 ID） -->
  <script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
    <img class="w-full h-64 object-cover" src="https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=600&q=80" alt="Product">
    <div class="p-6">
      <h1 class="text-2xl font-bold text-gray-800">Wireless Noise-Canceling Earbuds</h1>
      <p class="text-gray-500 text-sm mt-1">High-fidelity sound, 40h battery life.</p>
      <div class="mt-4 flex items-baseline justify-between">
        <span class="text-3xl font-extrabold text-indigo-600">$29.99</span>
        <span class="text-gray-400 line-through text-sm">$49.99</span>
      </div>
      <div class="mt-6" id="paypal-button-container"></div>
    </div>
  </div>
  <script>
    paypal.Buttons({
      createOrder: (data, actions) => actions.order.create({
        purchase_units: [{ amount: { value: '29.99' } }]
      }),
      onApprove: (data, actions) => actions.order.capture().then(details => {
        alert('Payment successful! Transaction ID: ' + details.id);
        window.location.href = "/success.html";
      })
    }).render('#paypal-button-container');
  </script>
</body>
</html>
